name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/dev-shell
      - name: Check formatting
        run: nix develop -c knave fmt --check
      - name: Run the linter
        run: |
          nix develop -c knave lint src/lib.knv
          nix develop -c knave lint tasks/file-lengths.knv
      - name: Check that no .knv file is longer than 150 lines
        run: nix develop -c knave task check-file-lengths
      - name: Check that the API docs are current
        run: |
          nix develop -c knave doc --write
          git add --all -- doc
          git diff --cached --exit-code -- doc
      - name: Run tests
        run: nix develop -c knave test
